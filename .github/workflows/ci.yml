name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, exif, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Bangun aset produksi
        run: npm run build

      - name: Jalankan pengujian
        run: php artisan test --compact
